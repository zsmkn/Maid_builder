plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Rendering smoke test: opens the world saves/selftest, shows a ghost preview, saves
        // screenshots/maidbuilder_selftest.png and quits. Needs a world named "selftest".
        clientSelfTest {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            systemProperty 'maidbuilder.selftest', 'true'
        }
        // Same smoke test with shaders: its own game directory (runs/shaders) whose mods/ holds
        // Iris + Sodium and whose shaderpacks/ + config/iris.properties pick the pack. Nothing is
        // added to the mod's dependencies.
        clientShaderTest {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            systemProperty 'maidbuilder.selftest', 'true'
        }
        // Runs all maidbuilder game tests, then exits (non-zero on failure).
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            gameDirectory = project.file(name == 'clientShaderTest' ? 'runs/shaders' : 'run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // core classes are shipped inside the mod jar, so they belong to the same mod at dev time
            sourceSet(project(':core').sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')
    implementation "maven.modrinth:touhou-little-maid:${tlm_version}"
}

// Embed the core module's classes directly in the mod jar.
tasks.named('jar', Jar) {
    from(project(':core').sourceSets.main.output)
    archiveFileName = "${mod_id}-release_${mod_version}_neoforge${minecraft_version}.jar"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            tlm_version_range      : tlm_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
